name: Deploy coqdoc to GitHub Pages

# The HTML is generated locally with doc/mkdoc.sh and committed; this workflow
# only publishes doc/html (building the Rocq development in CI would take too long).
on:
  push:
    branches: [master]
    paths: ["doc/html/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/html
      - id: deployment
        uses: actions/deploy-pages@v4
